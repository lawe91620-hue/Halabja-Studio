name: Build Halabja Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q HalabjaStudio_Android_Source_Starter-2.zip -d source

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Create JVM 17 init script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/halabja-jvm17.init.gradle" <<'GRADLE'
          import org.gradle.api.JavaVersion

          gradle.beforeProject { project ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  project.plugins.withId(pluginId) {
                      def android = project.extensions.findByName('android')
                      if (android != null) {
                          android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                          android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }

              project.tasks.configureEach { task ->
                  if (task.class.name.contains('KotlinCompile')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        id: build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/gradle-build.log"

          gradle \
            --console=plain \
            --stacktrace \
            --init-script "$RUNNER_TEMP/halabja-jvm17.init.gradle" \
            -p "$PROJECT_DIR" \
            assembleDebug 2>&1 | tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo "::error::Gradle build failed"
            grep -n -m 20 -E 'What went wrong:|Execution failed for task|e: |error:|Could not |Failed to |Inconsistent JVM-target' "$BUILD_LOG" || true
            exit "$BUILD_STATUS"
          fi

          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "::error::APK file not found"
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halabja-Studio-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
