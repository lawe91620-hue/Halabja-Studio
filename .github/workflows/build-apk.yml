
name: Build Halabja Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q HalabjaStudio_Android_Source_Starter-2.zip -d source

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file not found."
            find source -maxdepth 8 -type f -print | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Create temporary JVM 17 Gradle init script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/halabja-jvm17.init.gradle" <<'GRADLE'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.beforeProject { project ->
              project.tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              project.tasks.configureEach { task ->
                  if (task.class.name.contains('KotlinCompile')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        id: build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -uo pipefail

          java -version
          gradle --version

          if gradle \
            --init-script "$RUNNER_TEMP/halabja-jvm17.init.gradle" \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --stacktrace; then
            echo "Build completed."
          else
            BUILD_STATUS=$?
            echo "::error::assembleDebug failed with exit code $BUILD_STATUS"

            echo "Gradle build files:"
            find "$PROJECT_DIR" -maxdepth 4 -type f \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -print

            echo "Generated APKs:"
            find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print || true

            exit "$BUILD_STATUS"
          fi

          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "::error::No debug APK was generated."
            exit 1
          fi

          echo "APK generated: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Halabja-Studio-APK
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
